# Dev infrastructure only — MySQL + Redis + RabbitMQ
# NestJS and Next.js run natively (turbo dev)
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: sealvo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: web_db
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./src/migrations/001_initial.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pexample']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: sealvo_redis
    restart: unless-stopped
    command: redis-server --maxmemory-policy volatile-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sealvo_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
