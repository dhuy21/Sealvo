# Puts an earlier build back in place: deploys the images of the given commit again (deploy.yml points
# the environment tag at them, redeploys and waits until the services report that commit).
# Nothing is rebuilt. The images read their configuration at runtime, so any environment can run them;
# the commit must still be on the environment's branch (main for production, staging for staging).
name: Rollback

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        required: true
        type: choice
        options:
          - production
          - staging
      sha:
        description: 'Full commit SHA of an earlier deploy of this environment'
        required: true
        type: string

jobs:
  check:
    name: Check the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHA: ${{ inputs.sha }}
      BRANCH: ${{ inputs.environment == 'production' && 'main' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the commit belongs to the environment's branch
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA" >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" "origin/$BRANCH" \
            || { echo "$SHA is not on $BRANCH: it was never released to $BRANCH" >&2; exit 1; }

      # The database is not rolled back: the old code runs against the schema these migrations left
      # (docs/railway-setup.md, Rollback: expand/contract)
      - name: List the migrations kept
        run: |
          migrations=$(git diff --name-only --diff-filter=A "$SHA" "origin/$BRANCH" -- 'apps/api/prisma/migrations/*/migration.sql' | cut -d/ -f5)
          {
            echo "### Migrations newer than $SHA (kept in the database)"
            if [ -n "$migrations" ]; then while read -r m; do echo "- $m"; done <<< "$migrations"; else echo "None."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$migrations" ] || echo "::warning::The database keeps migrations newer than $SHA: $(tr '\n' ' ' <<< "$migrations")"

  deploy:
    name: Deploy
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.sha }}
      # The tag's previous images are the release being rolled back: a failed check must not restore them
      restore-tag-on-failure: false
    # Same-repo workflow that needs the environment's Railway secrets
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
