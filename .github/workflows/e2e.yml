# On-demand E2E smoke test against production or staging.
# Triggered manually or after deploy via workflow_call.
name: E2E

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  e2e:
    name: E2E (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment-scoped variables and secrets (STAGING_URL, E2E_USERNAME, E2E_PASSWORD)
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - name: Run E2E
        # An empty BASE_URL would make playwright.config.ts fall back to localhost
        run: |
          : "${BASE_URL:?BASE_URL is empty: set vars.STAGING_URL}"
          npx turbo test:e2e --filter=@sealvo/web
        env:
          BASE_URL: ${{ inputs.target == 'production' && (vars.PRODUCTION_URL || 'https://www.sealvo.it.com') || vars.STAGING_URL }}
          # Seeded account (apps/api/prisma/seed.mjs); the protected-page specs skip when unset
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.target }}
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          echo "### E2E ${{ inputs.target }} — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
