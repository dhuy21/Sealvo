# On-demand E2E smoke test against production or staging.
# Triggered manually or after deploy via workflow_call.
name: E2E

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      version:
        description: 'Commit the environment must run during the whole test (empty: not checked)'
        required: false
        type: string
        default: ''

jobs:
  e2e:
    name: E2E (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment-scoped variables and secrets (STAGING_URL, E2E_USERNAME, E2E_PASSWORD)
    environment: ${{ inputs.target }}
    env:
      BASE_URL: ${{ inputs.target == 'production' && (vars.PRODUCTION_URL || 'https://www.sealvo.it.com') || vars.STAGING_URL }}
      API_URL: ${{ vars.API_URL }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
        working-directory: apps/web
      # A newer deploy may start while the tests run: the result only vouches for VERSION if both the
      # web and the API ran it before and after
      - name: Check the deployed version (before)
        if: inputs.version != ''
        run: .github/scripts/check-version.sh
      - name: Run E2E
        # An empty BASE_URL would make playwright.config.ts fall back to localhost
        run: |
          : "${BASE_URL:?BASE_URL is empty: set vars.STAGING_URL}"
          npx turbo test:e2e --filter=@sealvo/web
        env:
          # Seeded account (apps/api/prisma/seed.mjs); the protected-page specs skip when unset
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Check the deployed version (after)
        if: inputs.version != ''
        run: .github/scripts/check-version.sh
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ inputs.target }}
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          echo "### E2E $TARGET — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
