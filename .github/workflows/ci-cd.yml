# CI/CD pipeline for Sealvo monorepo (Turborepo)
# Triggers: PR → lint+test, staging push → deploy staging, main push → deploy prod
name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # ── 1. LINT & TEST ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: NPM audit (production deps)
        run: npm audit --audit-level=critical --omit=dev
      # Type-aware lint and tests need the generated Prisma client types
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npx turbo lint
      - run: npx turbo test
      - run: npx turbo build

  # ── 2. BUILD, SCAN & PUSH ──────────────────────────────────
  docker-build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 20
    # Environment-scoped variables: NEXT_PUBLIC_API_URL differs between staging and production
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: apps/api/Dockerfile }
          - { image: web, dockerfile: apps/web/Dockerfile }
          - { image: backup, dockerfile: apps/api/Dockerfile.backup }
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve tags
        id: meta
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.image }}"
          case "${{ github.ref }}" in
            refs/heads/main)
              TAGS="${IMG}:latest,${IMG}:sha-${{ github.sha }}" ;;
            refs/heads/staging)
              TAGS="${IMG}:staging,${IMG}:sha-${{ github.sha }}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # An empty value would be baked into the bundle and the site would call the wrong API
      - name: Check NEXT_PUBLIC_API_URL
        if: matrix.image == 'web'
        run: |
          : "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is empty: set it as a variable of the GitHub environment}"
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.image != 'backup' && format('GIT_SHA={0}', github.sha) || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned by digest (aquasec/trivy:0.76.0). The container only gets the registry
      # credentials, through the environment, to pull the image it scans.
      # Lists CRITICAL and HIGH, then fails the job (and so blocks the deploy) on fixable CRITICAL only
      - name: Trivy vulnerability scan
        run: |
          trivy() {
            docker run --rm \
              --cap-drop ALL --security-opt no-new-privileges \
              -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image \
                --ignore-unfixed --format table "$@" "$IMAGE"
          }
          trivy --severity CRITICAL,HIGH --exit-code 0
          trivy --severity CRITICAL --exit-code 1 --quiet
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### Docker Build — ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:** \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3a. DEPLOY PRODUCTION ──────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.sealvo.it.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Redeploy API
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_API_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}

      # A 200 alone could come from the previous deployment: wait until /health reports this commit
      - name: Health check (API)
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$API_URL" ]; then
            echo "RAILWAY_TOKEN or API_URL not set, skip." && exit 0
          fi
          for i in $(seq 1 30); do
            VERSION=$(curl -fsS --max-time 10 "$API_URL/health" | jq -r '.version // empty' 2>/dev/null || true)
            echo "Attempt $i: version=${VERSION:-none}"
            [ "$VERSION" = "$EXPECTED_VERSION" ] && exit 0
            sleep 20
          done
          echo "API did not report version $EXPECTED_VERSION within 10 minutes." && exit 1
        env:
          API_URL: ${{ vars.API_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_VERSION: ${{ github.sha }}

      - name: Redeploy Web
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WEB_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}

      - name: Redeploy Worker
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_WORKER_SERVICE_ID" ] && echo "Worker service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WORKER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}

      - name: Redeploy Scheduler
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_SCHEDULER_SERVICE_ID" ] && echo "Scheduler service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_SCHEDULER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SCHEDULER_SERVICE_ID: ${{ secrets.RAILWAY_SCHEDULER_SERVICE_ID }}

      - name: Redeploy Backup (cron)
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_BACKUP_SERVICE_ID" ] && echo "Backup service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_BACKUP_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKUP_SERVICE_ID: ${{ secrets.RAILWAY_BACKUP_SERVICE_ID }}

      - name: Summary
        if: always()
        run: |
          echo "### Deploy Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. DEPLOY STAGING ─────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Redeploy API
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_API_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}

      # A 200 alone could come from the previous deployment: wait until /health reports this commit
      - name: Health check (API)
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$API_URL" ]; then
            echo "RAILWAY_TOKEN or API_URL not set, skip." && exit 0
          fi
          for i in $(seq 1 30); do
            VERSION=$(curl -fsS --max-time 10 "$API_URL/health" | jq -r '.version // empty' 2>/dev/null || true)
            echo "Attempt $i: version=${VERSION:-none}"
            [ "$VERSION" = "$EXPECTED_VERSION" ] && exit 0
            sleep 20
          done
          echo "API did not report version $EXPECTED_VERSION within 10 minutes." && exit 1
        env:
          API_URL: ${{ vars.API_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_VERSION: ${{ github.sha }}

      - name: Redeploy Web
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WEB_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}

      - name: Redeploy Worker
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_WORKER_SERVICE_ID" ] && echo "Worker service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WORKER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}

      - name: Redeploy Scheduler
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_SCHEDULER_SERVICE_ID" ] && echo "Scheduler service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_SCHEDULER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SCHEDULER_SERVICE_ID: ${{ secrets.RAILWAY_SCHEDULER_SERVICE_ID }}

      - name: Summary
        if: always()
        run: |
          echo "### Deploy Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
