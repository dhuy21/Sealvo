# CI/CD pipeline for Sealvo monorepo (Turborepo)
# Triggers: PR → lint+test, staging push → deploy staging, main push → deploy prod
name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

# PRs and develop: a new push cancels the previous run. main and staging: every run goes through, so
# each commit gets its images (a rollback target) and lint/test feedback even while a deploy waits for
# approval; the deploy job serializes the releases (deploy.yml) and skips superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # ── 1. LINT & TEST ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: NPM audit (production deps)
        run: npm audit --audit-level=critical --omit=dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npx turbo lint
      - run: npx turbo test
      - run: npx turbo build

  # ── 1b. MIGRATIONS ─────────────────────────────────────────
  # Applies every migration to an empty MySQL, then fails if schema.prisma has changes
  # that no migration contains
  migrations-check:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sealvo_ci
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/sealvo_shadow
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
        working-directory: .
      # Service containers take no command args (no --collation-server): set it per database.
      # Prisma does not create a missing shadow database.
      - name: Create databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "
            CREATE DATABASE sealvo_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE DATABASE sealvo_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
      - run: npx prisma migrate deploy
      - name: Schema matches migrations
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  # ── 2. BUILD, SCAN & PUSH ──────────────────────────────────
  docker-build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, migrations-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 20
    # staging and main fast-forwarded to the same commit build it once: the second run waits, then
    # finds the image and reuses it instead of pushing a different digest under the same tag
    concurrency:
      group: build-${{ github.sha }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Staging's E2E result for a reused image
      actions: read
    strategy:
      matrix:
        # The backup cron only runs in production: staging does not build its image
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"image":"api","dockerfile":"apps/api/Dockerfile"},{"image":"web","dockerfile":"apps/web/Dockerfile"},{"image":"backup","dockerfile":"apps/api/Dockerfile.backup"}]' || '[{"image":"api","dockerfile":"apps/api/Dockerfile"},{"image":"web","dockerfile":"apps/web/Dockerfile"}]') }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Only the immutable commit tag: deploy.yml moves :latest / :staging once the deploy is approved
      - name: Resolve image
        id: meta
        run: echo "ref=$REGISTRY/${{ steps.image.outputs.name }}/${{ matrix.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit tag is never overwritten: staging is fast-forwarded into main, so production gets the
      # exact image built and scanned on staging (a hotfix later fast-forwarded into staging, or a re-run,
      # reuses its image the same way). Only a commit with no image yet is built below.
      - name: Reuse an existing build
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE already exists: reused, not rebuilt"
          fi
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # Promotion: production reuses the staging image only once it passed E2E on staging.
      # A commit pushed to main directly has no staging image and is built above (the approver gates it).
      - name: Check staging passed
        if: steps.existing.outputs.found == 'true' && github.ref == 'refs/heads/main'
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=staging&event=push" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci-cd.yml")] | sort_by(.run_number) | last | .id // empty')
          [ -n "$run_id" ] || { echo "::error::No staging CI/CD run for $GITHUB_SHA"; exit 1; }
          e2e=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("E2E Staging"))] | first | .conclusion // "missing"')
          [ "$e2e" = success ] || { echo "::error::E2E Staging is '$e2e' for $GITHUB_SHA (run $run_id): not promoted"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

      # The scan below also covers a reused image: it was scanned when built, maybe weeks ago
      - name: Pull the existing image
        if: steps.existing.outputs.found == 'true'
        run: docker pull "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # Built into the runner's Docker only: nothing reaches the registry before the scan passes
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.ref }}
          build-args: |
            ${{ matrix.image != 'backup' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Pinned by digest (aquasec/trivy:0.76.0). The scanner reads an exported copy of the image
      # (read-only mount): no Docker socket, no registry credentials.
      # Lists CRITICAL and HIGH, then fails the job (and so blocks the push and the deploy) on fixable CRITICAL only
      - name: Trivy vulnerability scan
        run: |
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE"
          # Without capabilities the scanner's root cannot read a file owned by the runner user
          chmod a+r "$RUNNER_TEMP/image.tar"
          trivy() {
            docker run --rm \
              --cap-drop ALL --security-opt no-new-privileges \
              -v "$RUNNER_TEMP/image.tar:/scan/image.tar:ro" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image \
                --input /scan/image.tar --ignore-unfixed --format table "$@"
          }
          trivy --severity CRITICAL,HIGH --exit-code 0
          trivy --severity CRITICAL --exit-code 1 --quiet
          rm "$RUNNER_TEMP/image.tar"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # The scanned image itself
      - name: Push
        if: steps.existing.outputs.found != 'true'
        run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docker Build — ${{ matrix.image }}"
            echo "- **Image:** \`${{ steps.meta.outputs.ref }}\`"
            echo "- **Source:** ${{ steps.existing.outputs.found == 'true' && 'reused (already built)' || 'built' }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. DEPLOY ───────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    needs: docker-build-push
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ github.sha }}
      skip-if-superseded: true
    secrets: inherit

  deploy-staging:
    name: Deploy Staging
    needs: docker-build-push
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ github.sha }}
      skip-if-superseded: true
    secrets: inherit

  # ── 4. E2E ON STAGING ──────────────────────────────────────
  e2e-staging:
    name: E2E Staging
    needs: deploy-staging
    # A superseded deploy left staging on a newer commit: testing it would vouch for the wrong commit
    if: needs.deploy-staging.outputs.deployed == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      target: staging
    secrets: inherit
