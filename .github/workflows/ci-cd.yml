# CI/CD pipeline for Sealvo monorepo (Turborepo)
# Triggers: PR → lint+test, staging push → deploy staging, main push → deploy prod
name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # ── 1. LINT & TEST ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: NPM audit (production deps)
        run: npm audit --audit-level=critical --omit=dev
      - run: npx turbo lint
      - run: npx turbo test

  # ── 2. BUILD, SCAN & PUSH ──────────────────────────────────
  docker-build-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve tags
        id: meta
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.app }}"
          case "${{ github.ref }}" in
            refs/heads/main)
              TAGS="${IMG}:latest,${IMG}:sha-${{ github.sha }}" ;;
            refs/heads/staging)
              TAGS="${IMG}:staging,${IMG}:sha-${{ github.sha }}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        continue-on-error: true
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" \
            -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:latest image \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format table \
              "$FIRST_TAG"

      - name: Summary
        if: always()
        run: |
          echo "### Docker Build — ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:** \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3a. DEPLOY PRODUCTION ──────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.sealvo.it.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Redeploy API
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_API_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}

      - name: Health check (API)
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || true)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed." && exit 1
        env:
          API_URL: ${{ vars.API_URL }}

      - name: Redeploy Web
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WEB_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}

      - name: Redeploy Worker
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_WORKER_SERVICE_ID" ] && echo "Worker service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WORKER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}

      - name: Redeploy Scheduler
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_SCHEDULER_SERVICE_ID" ] && echo "Scheduler service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_SCHEDULER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SCHEDULER_SERVICE_ID: ${{ secrets.RAILWAY_SCHEDULER_SERVICE_ID }}

      - name: Summary
        if: always()
        run: |
          echo "### Deploy Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. DEPLOY STAGING ─────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Redeploy API
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_API_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}

      - name: Health check (API)
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/api/health" || true)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed." && exit 1

      - name: Redeploy Web
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WEB_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}

      - name: Redeploy Worker
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_WORKER_SERVICE_ID" ] && echo "Worker service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_WORKER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}

      - name: Redeploy Scheduler
        run: |
          [ -z "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN not set, skip." && exit 0
          [ -z "$RAILWAY_SCHEDULER_SERVICE_ID" ] && echo "Scheduler service not set, skip." && exit 0
          npx -y @railway/cli redeploy --service "$RAILWAY_SCHEDULER_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SCHEDULER_SERVICE_ID: ${{ secrets.RAILWAY_SCHEDULER_SERVICE_ID }}

      - name: Summary
        if: always()
        run: |
          echo "### Deploy Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
