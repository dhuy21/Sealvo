# CI/CD pipeline for Sealvo monorepo (Turborepo)
# Triggers: PR → lint+test. A main push builds once, deploys the staging environment,
# runs E2E, then deploys production with that same commit. The staging branch does not deploy.
name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

# PRs and develop: a new push cancels the previous run. main and staging: every run goes through, so
# each commit gets its images (a rollback target) and lint/test feedback even while a deploy waits for
# approval; the deploy job serializes the releases (deploy.yml) and skips superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # ── 1. LINT & TEST ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: NPM audit (production deps)
        run: npm audit --audit-level=critical --omit=dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npx turbo lint
      - name: Architecture rules (dependency-cruiser)
        run: npm run lint:deps
      - run: npx turbo test
      - run: npx turbo build

  # ── 1a. SAST ───────────────────────────────────────────────
  # Semgrep OSS rulesets: an ERROR finding fails the run. A triaged false positive carries a
  # `nosemgrep: <rule id> (reason)` comment on the line it reports.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --metrics off --error --severity ERROR
          --config p/default --config p/nodejsscan --config p/typescript --config p/react
          --config p/nextjs --config p/jwt --config p/github-actions --config p/dockerfile
          --config p/secrets
          apps packages .github docker-compose.dev.yml docker-compose.prod.yml

  # ── 1b. MIGRATIONS ─────────────────────────────────────────
  # Applies every migration to an empty MySQL, then fails if schema.prisma has changes
  # that no migration contains
  migrations-check:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sealvo_ci
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/sealvo_shadow
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
        working-directory: .
      # Service containers take no command args (no --collation-server): set it per database.
      # Prisma does not create a missing shadow database.
      - name: Create databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "
            CREATE DATABASE sealvo_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE DATABASE sealvo_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
      - run: npx prisma migrate deploy
      - name: Schema matches migrations
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  # ── 2. BUILD, SCAN & PUSH ──────────────────────────────────
  # Pull requests build and scan every image without pushing: a Dockerfile or dependency change
  # (Dependabot) that breaks the build or brings a critical CVE fails the PR, not the next release
  docker-build-push:
    name: Build & ${{ github.event_name == 'push' && 'Push' || 'Scan' }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, migrations-check, semgrep]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
    timeout-minutes: 20
    # staging and main fast-forwarded to the same commit build it once: the second run waits, then
    # finds the image and reuses it instead of pushing a different digest under the same tag
    concurrency:
      group: build-${{ github.sha }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # The backup cron only runs in production: staging does not build its image
        include: ${{ fromJSON(github.ref == 'refs/heads/staging' && '[{"image":"api","dockerfile":"apps/api/Dockerfile"},{"image":"web","dockerfile":"apps/web/Dockerfile"}]' || '[{"image":"api","dockerfile":"apps/api/Dockerfile"},{"image":"web","dockerfile":"apps/web/Dockerfile"},{"image":"backup","dockerfile":"apps/api/Dockerfile.backup"}]') }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Only the immutable commit tag: deploy.yml moves :latest / :staging once the deploy is approved
      - name: Resolve image
        id: meta
        run: echo "ref=$REGISTRY/${{ steps.image.outputs.name }}/${{ matrix.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit tag is never overwritten. Production later deploys this same sha after E2E on
      # the staging environment, so it reuses the image built here. Only a commit with no image
      # yet is built below.
      # Only "not found" means build: a registry error must not rebuild and overwrite an existing tag
      - name: Reuse an existing build
        id: existing
        if: github.event_name == 'push'
        run: |
          if error=$(docker buildx imagetools inspect "$IMAGE" 2>&1 >/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE already exists: reused, not rebuilt"
          elif ! grep -qiE 'not found|manifest unknown' <<< "$error"; then
            echo "::error::Cannot tell whether $IMAGE exists: $error"
            exit 1
          fi
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # The scan below also covers a reused image: it was scanned when built, maybe weeks ago
      - name: Pull the existing image
        if: steps.existing.outputs.found == 'true'
        run: docker pull "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # Built into the runner's Docker only: nothing reaches the registry before the scan passes
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.ref }}
          build-args: |
            ${{ matrix.image != 'backup' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.image) || '' }}

      # Pinned by digest (aquasec/trivy:0.76.0). The scanner reads an exported copy of the image
      # (read-only mount): no Docker socket, no registry credentials.
      # Lists CRITICAL and HIGH, then fails the job (and so blocks the push and the deploy) on fixable CRITICAL only
      - name: Trivy vulnerability scan
        run: |
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE"
          # Without capabilities the scanner's root cannot read a file owned by the runner user
          chmod a+r "$RUNNER_TEMP/image.tar"
          trivy() {
            docker run --rm \
              --cap-drop ALL --security-opt no-new-privileges \
              -v "$RUNNER_TEMP/image.tar:/scan/image.tar:ro" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image \
                --input /scan/image.tar --ignore-unfixed --format table "$@"
          }
          trivy --severity CRITICAL,HIGH --exit-code 0
          trivy --severity CRITICAL --exit-code 1 --quiet
          rm "$RUNNER_TEMP/image.tar"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      # The scanned image itself
      - name: Push
        if: github.event_name == 'push' && steps.existing.outputs.found != 'true'
        run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docker Build — ${{ matrix.image }}"
            echo "- **Image:** \`${{ steps.meta.outputs.ref }}\`"
            echo "- **Source:** ${{ steps.existing.outputs.found == 'true' && 'reused (already built)' || 'built' }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. DEPLOY ───────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    needs: [docker-build-push, e2e-staging]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e-staging.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ github.sha }}
      skip-if-superseded: true
      branch: main
    # Same-repo workflows that need the environment's Railway and E2E secrets
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  deploy-staging:
    name: Deploy Staging
    needs: docker-build-push
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ github.sha }}
      skip-if-superseded: true
      branch: main
    # Same-repo workflows that need the environment's Railway and E2E secrets
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  # ── 4. E2E ON STAGING ──────────────────────────────────────
  e2e-staging:
    name: E2E Staging
    needs: deploy-staging
    # A superseded deploy left staging on a newer commit: testing it would vouch for the wrong commit
    if: needs.deploy-staging.outputs.deployed == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      target: staging
      version: ${{ github.sha }}
    # Same-repo workflows that need the environment's Railway and E2E secrets
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
