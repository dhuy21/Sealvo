# Actions and Docker base images are pinned by SHA/digest: Dependabot proposes the updates.
# Opened against main, grouped to keep the PR count low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    # Let a release age a week before proposing it (time for a compromised version to be pulled)
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    target-branch: main
    schedule:
      interval: weekly
    # Let a release age a week before proposing it (time for a compromised version to be pulled)
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # The app and CI run Node 22. A Node 25 base image is a different runtime.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    # Let a release age a week before proposing it (time for a compromised version to be pulled)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Vitest 5 fails typecheck (TS2742 on a test helper). Stay on 4 until that is fixed.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
